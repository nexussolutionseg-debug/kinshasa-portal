<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Chrome tab / browser favicon — the same DRC-flag badge used as the
       site's brand mark (see src/components/BrandMark.tsx: KinshasaMark),
       redrawn as a static file since favicons must be a plain SVG/PNG/ICO
       asset rather than a React component. Next.js's App Router picks up
       `app/icon.svg` automatically and adds the right <link rel="icon">
       tag — no other wiring needed. Keep this in sync with KinshasaMark if
       that component's geometry or colors ever change. -->
  <defs>
    <clipPath id="flag-clip">
      <circle cx="24" cy="24" r="21" />
    </clipPath>
  </defs>
  <g clip-path="url(#flag-clip)">
    <rect x="3" y="3" width="42" height="42" fill="#007FFF" />
    <line x1="3" y1="45" x2="45" y2="3" stroke="#F7D618" stroke-width="7.14" />
    <line x1="3" y1="45" x2="45" y2="3" stroke="#CE1021" stroke-width="4.2" />
    <path
      d="M0,-1 L0.2245,-0.309 L0.9511,-0.309 L0.3633,0.118 L0.5878,0.809 L0,0.382 L-0.5878,0.809 L-0.3633,0.118 L-0.9511,-0.309 L-0.2245,-0.309 Z"
      fill="#F7D618"
      transform="translate(13.08 13.92) scale(4.62)"
    />
  </g>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#C8992E" stroke-width="1.75" />
  <circle cx="24" cy="24" r="17.5" fill="none" stroke="#C8992E" stroke-width="0.6" opacity="0.5" />
</svg>
